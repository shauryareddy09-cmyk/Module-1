<html>
    <head></head>
    <body>
        <h4>Javascript String Method</h4>
        <p>This is to check the javascript id</p>
        <p id="number"></p>
        <p id="letter"></p>
        <script>
            var a=80
            var b=100
            document.getElementById('number').innerHTML=a+b;
            document.getElementById('letter').innerHTML=String(a)+String(b)
        </script>
    </body>
</html>
